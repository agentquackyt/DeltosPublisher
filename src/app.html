<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publisher</title>
    <link rel="stylesheet" href="css/layouts/app.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=book_2,format_image_left,history,home,redo,save,system_update_alt,undo" />
</head>

<body>
    <header>
        <div class="icon">
            <h1>Publisher</h1>
            <h2>by Jonas Gaden</h2>
        </div>
        <div class="nav-quick-links">
            <li class="material-symbols-rounded" data-nav-action="editor.history.undo">undo</li>
            <li class="material-symbols-rounded" data-nav-action="editor.history.open">history</li>
            <li class="material-symbols-rounded" data-nav-action="editor.history.redo">redo</li>
        </div>
        <div class="nav-quick-links">
            <li class="material-symbols-rounded" data-nav-action="save.project">save</li>
            <li class="material-symbols-rounded" data-nav-action="export.project">system_update_alt</li>
        </div>
    </header>
    <div id="app-wrapper">
        <nav>
            <li class="material-symbols-rounded" data-nav-action="dashboard">home</li>
            <li class="material-symbols-rounded" data-nav-action="save.project">save</li>
            <li class="material-symbols-rounded" data-nav-action="open.design">format_image_left</li>
            <li class="material-symbols-rounded" data-nav-action="open.content">book_2</li>
        </nav>
        <main>
            <canvas id="target">
                
            </canvas>
        </main>
        <aside>
            <div class="aside-head">
                <h3>Properties</h3>
                <li class="material-symbols-rounded" data-nav-action="editor.sidebar.toggle">close</li>
            </div>
        </aside>
    </div>
</body>

</html>
